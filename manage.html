<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeSnap Content Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        window.onerror = function(msg, url, line) {
            alert("System Error: " + msg);
        };
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyD-tG7cRV5v9k5fb_QE2dLo0CnYEHtV_wE",
            authDomain: "vibesnap-live.firebaseapp.com",
            projectId: "vibesnap-live",
            storageBucket: "vibesnap-live.firebasestorage.app",
            messagingSenderId: "558903357110",
            appId: "1:558903357110:web:7f602f38208645eca3c017"
        };
        const appId = "vibesnap-live";
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const AUTHORIZED_EMAILS = ['ande.uday143@gmail.com', 'k.rohith0507@gmail.com', 'vibesnapteam@gmail.com'];

        // --- UI REFS ---
        const loginOverlay = document.getElementById('loginOverlay');
        const dashboard = document.getElementById('dashboard');
        const statusMsg = document.getElementById('statusMsg');

        // --- AUTH LOGIC ---
        function updateStatus(msg) {
            if(statusMsg) statusMsg.textContent = "Status: " + msg;
            console.log("Status:", msg);
        }

        if(document.getElementById('googleLoginBtn')){
            document.getElementById('googleLoginBtn').addEventListener('click', () => {
                updateStatus("Signing in...");
                signInWithPopup(auth, provider).catch(e => alert("Login Error: " + e.message));
            });
        }
        if(document.getElementById('logoutBtn')){
            document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth).then(() => window.location.reload()));
        }

        onAuthStateChanged(auth, (user) => {
            if (user && AUTHORIZED_EMAILS.includes(user.email)) {
                updateStatus("Authorized. Loading Data...");
                loginOverlay.classList.add('hidden');
                dashboard.classList.remove('hidden');
                loadContent();
            } else {
                updateStatus("Waiting for Login...");
                loginOverlay.classList.remove('hidden');
                dashboard.classList.add('hidden');
                if(user && !AUTHORIZED_EMAILS.includes(user.email)) {
                    alert("Access Denied: Email not authorized.");
                    signOut(auth); 
                }
            }
        });

        // --- CONTENT LOGIC ---
        function loadContent() {
            loadCollection('portfolio', 'portfolioList');
            loadCollection('reviews', 'reviewsList');
        }

        function loadCollection(colName, listId) {
            const list = document.getElementById(listId);
            list.innerHTML = `<div class="p-4 text-center text-blue-600 bg-blue-50 rounded-lg">Connecting to ${colName}...</div>`;

            const q = query(collection(db, 'artifacts', appId, 'public', 'data', colName));
            
            onSnapshot(q, (snapshot) => {
                updateStatus(`Loaded ${snapshot.size} items from ${colName}`);
                list.innerHTML = '';
                
                if(snapshot.empty) {
                    list.innerHTML = `<div class="text-gray-500 text-sm p-4 text-center border-2 border-dashed border-gray-300 rounded-lg">No items yet. Add one above!</div>`;
                    return;
                }

                const items = [];
                snapshot.forEach(doc => {
                    items.push({ id: doc.id, ...doc.data() });
                });
                
                items.sort((a, b) => {
                    const timeA = a.createdAt?.seconds || 0;
                    const timeB = b.createdAt?.seconds || 0;
                    return timeB - timeA;
                });

                items.forEach(data => {
                    const item = document.createElement('div');
                    
                    // FIX: Force solid white background and relative positioning
                    item.className = 'bg-white p-3 rounded-lg shadow-sm border border-gray-200 flex items-center gap-3 mb-3 relative z-0';
                    item.style.cssText = "background-color: white !important; color: black !important;";
                    
                    let contentHTML = '';
                    
                    if(colName === 'portfolio') {
                        contentHTML = `
                            <!-- 1. Image -->
                            <div class="w-16 h-16 flex-shrink-0 bg-gray-100 rounded-md overflow-hidden border border-gray-200 relative z-10">
                                <img src="${data.image}" class="w-full h-full object-cover block" onerror="this.src='https://via.placeholder.com/150?text=No+Img';">
                            </div>
                            
                            <!-- 2. Text: Replaced 'truncate' with 'break-words' and forced black color -->
                            <div class="flex-1 min-w-0 relative z-10" style="color: black !important;">
                                <p class="font-bold text-black text-sm break-words leading-tight">${data.title || 'Untitled'}</p>
                                <a href="${data.link}" target="_blank" class="text-blue-600 text-xs hover:underline flex items-center gap-1 mt-1 break-all">
                                    <i data-lucide="link" class="w-3 h-3"></i> Link
                                </a>
                            </div>
                        `;
                    } else {
                        contentHTML = `
                            <!-- 1. Icon -->
                            <div class="w-10 h-10 flex-shrink-0 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center relative z-10">
                                <i data-lucide="user" class="w-5 h-5"></i>
                            </div>

                            <!-- 2. Text: Replaced 'truncate' with 'break-words' and forced black color -->
                            <div class="flex-1 min-w-0 relative z-10" style="color: black !important;">
                                <p class="font-bold text-black text-sm break-words leading-tight">${data.name || 'Anonymous'} <span class="text-yellow-600 text-xs">(${data.rating || 5}★)</span></p>
                                <p class="text-black text-sm italic mt-1 break-words leading-tight">"${data.text || ''}"</p>
                            </div>`;
                    }

                    // 3. Delete Button
                    item.innerHTML = contentHTML;
                    
                    const delBtn = document.createElement('button');
                    delBtn.className = 'flex-shrink-0 w-10 h-10 flex items-center justify-center text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-full transition-colors relative z-10';
                    delBtn.innerHTML = '<i data-lucide="trash-2" class="w-5 h-5"></i>';
                    delBtn.onclick = () => deleteItem(colName, data.id);
                    
                    item.appendChild(delBtn);
                    list.appendChild(item);
                });
                
                if(window.lucide) window.lucide.createIcons();
                
            }, (error) => {
                console.error("FIRESTORE ERROR:", error);
                updateStatus("Error: " + error.code);
                list.innerHTML = `<div class="text-red-600 text-xs p-4 border border-red-200 bg-red-50 rounded-lg">Error: ${error.message}</div>`;
            });
        }

        async function deleteItem(colName, id) {
            if(confirm('Delete this item?')) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', colName, id);
                    await deleteDoc(docRef);
                } catch(e) {
                    alert("Delete failed: " + e.message);
                }
            }
        }

        document.getElementById('portfolioForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerText = 'Adding...';
            btn.disabled = true;
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'portfolio'), {
                    title: document.getElementById('work-title').value,
                    image: document.getElementById('work-image').value,
                    link: document.getElementById('work-link').value,
                    createdAt: serverTimestamp()
                });
                e.target.reset();
            } catch(err) { alert("Error adding item: " + err.message); }
            btn.innerHTML = originalText;
            btn.disabled = false;
        });

        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerText = 'Adding...';
            btn.disabled = true;
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'reviews'), {
                    name: document.getElementById('review-name').value,
                    rating: document.getElementById('review-rating').value,
                    text: document.getElementById('review-text').value,
                    createdAt: serverTimestamp()
                });
                e.target.reset();
            } catch(err) { alert("Error adding review: " + err.message); }
            btn.innerHTML = originalText;
            btn.disabled = false;
        });
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="loginOverlay" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="text-center p-8 bg-white border border-gray-200 shadow-xl rounded-2xl max-w-sm w-full mx-4">
            <div class="mb-4 text-red-600 flex justify-center"><i data-lucide="layout-grid" class="w-12 h-12"></i></div>
            <h1 class="text-2xl font-black mb-2 uppercase italic">VibeSnap Manager</h1>
            <p class="text-gray-500 mb-6 text-sm">Add Reels, Works, and Reviews</p>
            <button id="googleLoginBtn" class="w-full bg-black text-white px-6 py-3 rounded-xl font-bold hover:bg-gray-900 transition-all flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i> Sign in with Google
            </button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="hidden max-w-5xl mx-auto p-4 md:p-6 pb-20">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 py-4 border-b border-gray-200 sticky top-0 bg-gray-50 z-40">
            <div class="flex flex-col">
                <span class="text-xl font-black italic uppercase">Content <span class="text-red-600">Manager</span></span>
                <span id="statusMsg" class="text-xs font-mono text-blue-600 mt-1">Initializing...</span>
            </div>
            <div class="flex gap-3">
                <a href="index.html" target="_blank" class="bg-white px-3 py-2 rounded border border-gray-200 text-gray-600 font-bold hover:text-black hover:border-black flex items-center gap-1 text-xs transition-colors">
                    <i data-lucide="external-link" class="w-3 h-3"></i> Site
                </a>
                <button id="logoutBtn" class="bg-red-50 px-3 py-2 rounded border border-red-100 text-red-600 font-bold hover:bg-red-100 text-xs transition-colors">Logout</button>
            </div>
        </header>

        <!-- Portfolio Section -->
        <section class="mb-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <div class="flex items-center gap-3 mb-6 border-b border-gray-100 pb-4">
                <div class="bg-black text-white p-2 rounded"><i data-lucide="clapperboard" class="w-5 h-5"></i></div>
                <h2 class="text-lg font-bold uppercase tracking-wide">Add Portfolio</h2>
            </div>
            <form id="portfolioForm" class="grid gap-4 md:grid-cols-3 mb-8">
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Project Title</label>
                    <input id="work-title" type="text" placeholder="e.g., Summer Edit" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-black text-sm" required>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Image URL</label>
                    <input id="work-image" type="url" placeholder="https://..." class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-black text-sm" required>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Link URL</label>
                    <input id="work-link" type="url" placeholder="https://..." class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-black text-sm" required>
                </div>
                <button type="submit" class="bg-black text-white p-3 rounded-lg font-bold md:col-span-3 hover:bg-gray-800 transition-all flex items-center justify-center gap-2 text-sm">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Add to Portfolio
                </button>
            </form>
            
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Your Items</h3>
            <div id="portfolioList" class="max-h-96 overflow-y-auto pr-1 custom-scrollbar space-y-2">
                <!-- Items will load here -->
            </div>
        </section>

        <!-- Reviews Section -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <div class="flex items-center gap-3 mb-6 border-b border-gray-100 pb-4">
                <div class="bg-black text-white p-2 rounded"><i data-lucide="star" class="w-5 h-5"></i></div>
                <h2 class="text-lg font-bold uppercase tracking-wide">Add Review</h2>
            </div>
            <form id="reviewForm" class="grid gap-4 md:grid-cols-4 mb-8">
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Name</label>
                    <input id="review-name" type="text" placeholder="Client Name" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-black text-sm" required>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Rating</label>
                    <select id="review-rating" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-black bg-white text-sm">
                        <option value="5">5 Stars</option>
                        <option value="4">4 Stars</option>
                        <option value="3">3 Stars</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Review</label>
                    <input id="review-text" type="text" placeholder="Client feedback..." class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-black text-sm" required>
                </div>
                <button type="submit" class="bg-black text-white p-3 rounded-lg font-bold md:col-span-4 hover:bg-gray-800 transition-all flex items-center justify-center gap-2 text-sm">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Add Review
                </button>
            </form>
            
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Your Reviews</h3>
            <div id="reviewsList" class="max-h-96 overflow-y-auto pr-1 custom-scrollbar space-y-2">
                <!-- Items will load here -->
            </div>
        </section>
    </div>

    <script>
        if(window.lucide) lucide.createIcons();
    </script>
</body>
</html>
